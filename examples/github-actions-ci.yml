name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet test ResumeAgent.sln --configuration Release
      - run: npm install && npm run lint && npm run build
        working-directory: src/ResumeAgent.Web
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dependency-lockfile
          path: src/ResumeAgent.Web/package-lock.json
